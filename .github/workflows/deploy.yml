name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 24
      - run: npm install
        working-directory: ./zzz-league
      - run: npm run build
        working-directory: ./zzz-league
        env:
          # Set this as an Actions repo variable (Settings -> Secrets and variables -> Actions ->
          # Variables) once the backend is hosted somewhere reachable. Until then this is empty
          # and the frontend falls back to http://localhost:5158 (see src/lib/api.ts) -- meaning
          # every deployed build is non-functional against a real backend until this is set.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./zzz-league/build